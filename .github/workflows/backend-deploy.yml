name: Backend Deploy - Build Lambda Packages

on:
  workflow_dispatch

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    name: Build Lambda Packages
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::078716600427:role/job-search-github-actions-role
          aws-region: us-east-1
      
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Build and upload Lambda packages
        env:
          LAMBDA_CODE_BUCKET: job-search-lambda-code-5155151158151
          LAMBDA_CODE_KEY_PREFIX: lambda-code
        run: python scripts/build_lambda_packages.py
